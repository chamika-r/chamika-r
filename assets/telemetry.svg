<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 292" width="900" height="292" role="img" aria-label="GitHub telemetry: -- repositories, -- stars, -- followers, -- contributions in the last year." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>GitHub telemetry</title>
<style>
  text { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace; }
  .pulse { animation: p 1.8s ease-in-out infinite; }
  @keyframes p { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .bar { animation: g 1.1s ease-out both; transform-box: fill-box; transform-origin: bottom; }
  @keyframes g { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="900" height="292" fill="#06090d"/>
<rect x="4" y="4" width="892" height="284" rx="12" fill="#0a1017" stroke="#00ffe5" stroke-opacity=".3"/>
<g>
  <rect x="16" y="16" width="208" height="86" rx="10" fill="#06090d" stroke="#00ffe5" stroke-opacity=".45"/>
  <rect x="16" y="16" width="208" height="3" rx="1.5" fill="#00ffe5"/>
  <text x="32" y="42" font-size="10" letter-spacing="1.5" fill="#00ffe5">REPOSITORIES</text>
  <text x="32" y="82" font-size="34" font-weight="700" fill="#ffffff">--</text>
</g>
<g>
  <rect x="236" y="16" width="208" height="86" rx="10" fill="#06090d" stroke="#ff8c00" stroke-opacity=".45"/>
  <rect x="236" y="16" width="208" height="3" rx="1.5" fill="#ff8c00"/>
  <text x="252" y="42" font-size="10" letter-spacing="1.5" fill="#ff8c00">STARS</text>
  <text x="252" y="82" font-size="34" font-weight="700" fill="#ffffff">--</text>
</g>
<g>
  <rect x="456" y="16" width="208" height="86" rx="10" fill="#06090d" stroke="#00ff88" stroke-opacity=".45"/>
  <rect x="456" y="16" width="208" height="3" rx="1.5" fill="#00ff88"/>
  <text x="472" y="42" font-size="10" letter-spacing="1.5" fill="#00ff88">FOLLOWERS</text>
  <text x="472" y="82" font-size="34" font-weight="700" fill="#ffffff">--</text>
</g>
<g>
  <rect x="676" y="16" width="208" height="86" rx="10" fill="#06090d" stroke="#ff3e6c" stroke-opacity=".45"/>
  <rect x="676" y="16" width="208" height="3" rx="1.5" fill="#ff3e6c"/>
  <text x="692" y="42" font-size="10" letter-spacing="1.5" fill="#ff3e6c">CONTRIBUTIONS / 1Y</text>
  <text x="692" y="82" font-size="34" font-weight="700" fill="#ffffff">--</text>
</g>
<text x="24" y="130" font-size="11" letter-spacing="2" fill="#00ffe5">ACTIVITY // LAST 26 WEEKS</text>
<text x="560" y="130" font-size="11" text-anchor="end" fill="#8aa0b4">streak --</text>
<line x1="24" y1="244" x2="556" y2="244" stroke="#00ffe5" stroke-opacity=".3" stroke-dasharray="6 6"/>
<text x="290" y="205" font-size="12" text-anchor="middle" fill="#3b5563">awaiting first sync</text>
<line x1="24" y1="248" x2="556" y2="248" stroke="#00ffe5" stroke-opacity=".2"/>
<text x="600" y="130" font-size="11" letter-spacing="2" fill="#00ffe5">LANGUAGES // BY CODE VOLUME</text>
<text x="600" y="190" font-size="12" fill="#3b5563">awaiting first sync</text>
<circle class="pulse" cx="30" cy="272" r="3.5" fill="#3b5563"/>
<text x="42" y="276" font-size="10" fill="#8aa0b4">first sync pending</text>
<text x="876" y="276" font-size="10" text-anchor="end" fill="#3b5563">rendered by scripts/telemetry.py</text>
</svg>
