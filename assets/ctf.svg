<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Capture the flag challenge banner: Breach the profile. Four stages: Signal, Source, Logs, Claim." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Breach the profile - CTF</title>
<style>
  text { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace; }
  .title { font-size: 46px; font-weight: 800; letter-spacing: 3px; }
  .g1 { fill: #ff3e6c; animation: g1 5s steps(1) infinite; }
  .g2 { fill: #00ffe5; animation: g2 5s steps(1) infinite; }
  @keyframes g1 { 0%,86%,100% { transform: translate(0,0); opacity: 0; } 87% { transform: translate(-5px,1px); opacity: .9; } 89% { transform: translate(4px,-2px); opacity: .9; } 91% { transform: translate(-2px,2px); opacity: .9; } 93% { transform: translate(0,0); opacity: 0; } }
  @keyframes g2 { 0%,86%,100% { transform: translate(0,0); opacity: 0; } 87% { transform: translate(5px,-1px); opacity: .9; } 89% { transform: translate(-4px,2px); opacity: .9; } 91% { transform: translate(2px,-2px); opacity: .9; } 93% { transform: translate(0,0); opacity: 0; } }
  .sub { font-size: 14px; fill: #8aa0b4; }
  .st { fill: #0a1017; stroke: #1f3a44; }
  .stt { font-size: 11px; letter-spacing: 2px; fill: #6b7c8f; }
  .stn { font-size: 15px; font-weight: 700; fill: #00ffe5; }
  .lit { animation: lit 6s linear infinite; }
  .lit2 { animation: lit 6s linear infinite; animation-delay: 1.2s; }
  .lit3 { animation: lit 6s linear infinite; animation-delay: 2.4s; }
  .lit4 { animation: lit 6s linear infinite; animation-delay: 3.6s; }
  @keyframes lit { 0%,8% { stroke: #1f3a44; } 14%,30% { stroke: #00ffe5; } 40%,100% { stroke: #1f3a44; } }
  .flow { stroke-dasharray: 6 6; animation: flow 1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -12; } }
  .scan { animation: scan 4s linear infinite; }
  @keyframes scan { from { transform: translateY(-30px); } to { transform: translateY(280px); } }
  @media (prefers-reduced-motion: reduce) { .g1,.g2,.lit,.lit2,.lit3,.lit4,.flow,.scan { animation: none; } .g1,.g2 { opacity: 0; } }
</style>
<defs>
  <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#ff3e6c" stroke-opacity="0.06"/></pattern>
  <linearGradient id="sl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3e6c" stop-opacity="0"/><stop offset=".5" stop-color="#ff3e6c" stop-opacity=".09"/><stop offset="1" stop-color="#ff3e6c" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect x="8" y="8" width="884" height="234" rx="12"/></clipPath>
</defs>
<rect width="900" height="250" fill="#06090d"/>
<rect x="8" y="8" width="884" height="234" rx="12" fill="#0a1017"/>
<g clip-path="url(#c)">
  <rect x="8" y="8" width="884" height="234" fill="url(#g)"/>
  <rect class="scan" x="8" y="0" width="884" height="30" fill="url(#sl)"/>
  <text x="450" y="44" text-anchor="middle" font-size="12" letter-spacing="4" fill="#ff3e6c">// CAPTURE THE FLAG //</text>
  <g text-anchor="middle">
    <text class="title g1" x="450" y="104">BREACH THE PROFILE</text>
    <text class="title g2" x="450" y="104">BREACH THE PROFILE</text>
    <text class="title" x="450" y="104" fill="#ffffff">BREACH THE PROFILE</text>
    <text class="sub" x="450" y="132">encoding  +  recon  +  log analysis  -  no special tools required (but they help)</text>
  </g>
  <!-- stage chain -->
  <g>
    <rect class="st lit"  x="90"  y="160" width="150" height="58" rx="8"/>
    <rect class="st lit2" x="268" y="160" width="150" height="58" rx="8"/>
    <rect class="st lit3" x="446" y="160" width="150" height="58" rx="8"/>
    <rect class="st lit4" x="624" y="160" width="186" height="58" rx="8"/>
    <line class="flow" x1="240" y1="189" x2="268" y2="189" stroke="#ff3e6c"/>
    <line class="flow" x1="418" y1="189" x2="446" y2="189" stroke="#ff3e6c"/>
    <line class="flow" x1="596" y1="189" x2="624" y2="189" stroke="#ff3e6c"/>
    <text class="stt" x="106" y="182">STAGE 0</text><text class="stn" x="106" y="204">SIGNAL</text>
    <text class="stt" x="284" y="182">STAGE 1</text><text class="stn" x="284" y="204">SOURCE</text>
    <text class="stt" x="462" y="182">STAGE 2</text><text class="stn" x="462" y="204">LOGS</text>
    <text class="stt" x="640" y="182">STAGE 3</text><text class="stn" x="640" y="204">CLAIM YOUR FLAG</text>
  </g>
</g>
<rect x="8.5" y="8.5" width="883" height="233" rx="12" fill="none" stroke="#ff3e6c" stroke-opacity="0.45"/>
</svg>
