<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 128" width="900" height="128" role="img" aria-label="Key results: 97.2 percent phishing detection accuracy, 9 real vulnerabilities found on DVWA, 80 CVEs found in 5 packages, 8 security tools shipped with 1 live in production." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Results at a glance</title>
<style>
  text { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace; }
  .num { font-size: 40px; font-weight: 700; }
  .lbl { font-size: 12.5px; fill: #c8d8e8; }
  .sub { font-size: 11px; fill: #6b7c8f; }
  .tag { font-size: 10.5px; letter-spacing: 1.5px; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  .edge { animation: edge 6s ease-in-out infinite; }
  @keyframes edge { 0%,100% { stroke-opacity: .25; } 50% { stroke-opacity: .6; } }
  @media (prefers-reduced-motion: reduce) { .pulse, .edge { animation: none; } }
</style>
<rect width="900" height="128" fill="#06090d"/>

<!-- tile 1 -->
<g>
  <rect class="edge" x="8" y="8" width="208" height="112" rx="10" fill="#0a1017" stroke="#00ffe5"/>
  <rect x="8" y="8" width="208" height="3" rx="1.5" fill="#00ffe5"/>
  <text class="tag" x="24" y="34" fill="#00ffe5">DETECT</text>
  <text class="num" x="24" y="76" fill="#ffffff">97.2%</text>
  <text class="lbl" x="24" y="98">phishing accuracy</text>
  <text class="sub" x="24" y="113">5,172 real emails</text>
</g>
<!-- tile 2 -->
<g>
  <rect class="edge" x="234" y="8" width="208" height="112" rx="10" fill="#0a1017" stroke="#ff3e6c"/>
  <rect x="234" y="8" width="208" height="3" rx="1.5" fill="#ff3e6c"/>
  <text class="tag" x="250" y="34" fill="#ff3e6c">BREAK</text>
  <text class="num" x="250" y="76" fill="#ffffff">9</text>
  <text class="lbl" x="250" y="98">real vulns on DVWA</text>
  <text class="sub" x="250" y="113">incl. 1 CRITICAL SQLi</text>
</g>
<!-- tile 3 -->
<g>
  <rect class="edge" x="460" y="8" width="208" height="112" rx="10" fill="#0a1017" stroke="#ff8c00"/>
  <rect x="460" y="8" width="208" height="3" rx="1.5" fill="#ff8c00"/>
  <text class="tag" x="476" y="34" fill="#ff8c00">SUPPLY CHAIN</text>
  <text class="num" x="476" y="76" fill="#ffffff">80</text>
  <text class="lbl" x="476" y="98">CVEs in 5 packages</text>
  <text class="sub" x="476" y="113">via Google OSV</text>
</g>
<!-- tile 4 -->
<g>
  <rect class="edge" x="686" y="8" width="206" height="112" rx="10" fill="#0a1017" stroke="#00ff88"/>
  <rect x="686" y="8" width="206" height="3" rx="1.5" fill="#00ff88"/>
  <text class="tag" x="702" y="34" fill="#00ff88">SHIPPED</text>
  <text class="num" x="702" y="76" fill="#ffffff">8</text>
  <text class="lbl" x="702" y="98">security tools built</text>
  <circle class="pulse" cx="706" cy="109" r="3.5" fill="#00ff88"/>
  <text class="sub" x="716" y="113">1 live in production</text>
</g>
</svg>
