<line x1="0" y1="12" x2="900" y2="12" stroke="url(#b)" stroke-width="1"/>
<rect class="p" x="0" y="11" width="140" height="2" fill="url(#l)"/>
<circle cx="450" cy="12" r="2.5" fill="#00ffe5" fill-opacity=".6"/>
