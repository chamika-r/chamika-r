<defs>
  <linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00ffe5" stop-opacity="0"/><stop offset="1" stop-color="#00ffe5"/></linearGradient>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00ffe5" stop-opacity="0"/><stop offset=".5" stop-color="#00ffe5" stop-opacity=".18"/><stop offset="1" stop-color="#00ffe5" stop-opacity="0"/></linearGradient>
