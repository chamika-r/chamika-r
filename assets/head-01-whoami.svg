<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 52" width="900" height="52" role="img" aria-label="Section 01: whoami">
<style>
  text { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace; }
  .cur { animation: b 1s steps(1) infinite; }
  @keyframes b { 50% { opacity: 0; } }
  .glint { animation: g 5s linear infinite; }
  @keyframes g { from { transform: translateX(-160px); } to { transform: translateX(900px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00ffe5" stop-opacity="0"/><stop offset="1" stop-color="#00ffe5"/></linearGradient>
  <clipPath id="c"><rect x="10" y="46" width="880" height="3"/></clipPath>
</defs>
<rect x="1" y="1" width="898" height="50" rx="10" fill="#0a1017" stroke="#00ffe5" stroke-opacity=".35"/>
<text x="24" y="32" font-size="13" letter-spacing="2" fill="#00ffe5">[01]</text>
<text x="72" y="34" font-size="20" font-weight="700" fill="#ffffff">~/whoami</text>
<rect class="cur" x="172" y="17" width="11" height="21" fill="#00ffe5"/>
<text x="876" y="32" font-size="11" letter-spacing="2" text-anchor="end" fill="#3b5563">// who is this</text>
<rect x="10" y="47" width="880" height="1" fill="#00ffe5" fill-opacity=".18"/>
<g clip-path="url(#c)"><rect class="glint" x="0" y="46" width="160" height="3" fill="url(#gl)"/></g>
