name: CTF claim check

# Runs when someone opens an issue titled "[CTF] ...".
# Verifies a salted proof of solve: sha256("<FLAG>:<lowercase github username>").
# The real flag lives in the repository secret CTF_FLAG, never in this file.

on:
  issues:
    types: [opened]

permissions:
  issues: write   # comment, label, close. Nothing else.

jobs:
  check:
    if: startsWith(github.event.issue.title, '[CTF]')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify proof of solve
        # SECURITY: issue title/body are attacker-controlled. They are passed via
        # environment variables and only ever used as quoted shell variables,
        # never interpolated with ${{ }} inside the script (script injection).
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number }}
          LOGIN: ${{ github.event.issue.user.login }}
          BODY: ${{ github.event.issue.body }}
          FLAG: ${{ secrets.CTF_FLAG }}
        run: |
          set -euo pipefail

          if [ -z "$FLAG" ]; then
            echo "CTF_FLAG secret is not configured" >&2
            exit 1
          fi

          LOGIN_LC="$(printf '%s' "$LOGIN" | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(printf '%s' "${FLAG}:${LOGIN_LC}" | sha256sum | cut -d' ' -f1)"
          SUBMITTED="$(printf '%s' "$BODY" | grep -oiE '[0-9a-f]{64}' | head -n1 | tr '[:upper:]' '[:lower:]' || true)"

          if [ -n "$SUBMITTED" ] && [ "$SUBMITTED" = "$EXPECTED" ]; then
            gh label create pwned --repo "$REPO" --color 00ffe5 \
              --description "Solved the profile CTF" --force >/dev/null
            PRIOR="$(gh issue list --repo "$REPO" --label pwned --state all --json number --jq 'length')"
            gh issue edit "$NUM" --repo "$REPO" --add-label pwned

            if [ "$PRIOR" = "0" ]; then
              MSG="**FIRST BLOOD.** @${LOGIN}, you were the first to breach this profile. Well played."
            else
              MSG="**ACCESS GRANTED.** @${LOGIN}, you are solver #$((PRIOR + 1)). Welcome to the wall of fame."
            fi
            gh issue comment "$NUM" --repo "$REPO" --body "$MSG"
            gh issue close "$NUM" --repo "$REPO" --reason completed
          else
            gh issue comment "$NUM" --repo "$REPO" --body "**ACCESS DENIED.** That proof doesn't match for @${LOGIN}. Check the flag and remember the format: \`sha256(FLAG{...}:your-lowercase-username)\`. Open a new issue to try again."
            gh issue close "$NUM" --repo "$REPO" --reason "not planned"
          fi
